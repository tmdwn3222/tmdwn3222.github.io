<h1>개인정보처리방침</h1>
<p>33 calender는 개발자 본인만 사용하는 개인용 프로그램입니다.</p>
<h2>사용하는 정보</h2>
<p>구글 캘린더 일정 권한(calendar.events)을 사용하여 본인 캘린더에 숙소 입실·퇴실 일정을 만들고, 수정하고, 취소된 예약의 일정을 삭제합니다.</p>
<h2>보관 및 공유</h2>
<p>인증 정보와 일정 정보는 사용자 본인의 컴퓨터에만 저장되며, 어떤 제3자에게도 전송하거나 공유하지 않습니다.</p>
<h2>권한 철회</h2>
<p>언제든지 구글 계정 설정(myaccount.google.com/permissions)에서 이 앱의 접근 권한을 삭제할 수 있습니다.</p>
